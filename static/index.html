<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TranslateGemma</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    header h1 { font-size: 1.4rem; font-weight: 700; color: #a78bfa; }

    /* ── 탭 ── */
    .tabs {
      width: 100%;
      max-width: 800px;
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      border-bottom: 2px solid #1e2130;
    }

    .tab {
      padding: 10px 22px;
      border-radius: 8px 8px 0 0;
      background: none;
      border: none;
      color: #6b7280;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }
    .tab:hover { color: #e2e8f0; }
    .tab.active { color: #a78bfa; background: #1e2130; }

    .tab-panel { display: none; width: 100%; max-width: 800px; }
    .tab-panel.active { display: flex; flex-direction: column; gap: 16px; }

    /* ── 공통 컨트롤 ── */
    .controls {
      background: #1e2130;
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    select, input[type="text"] {
      background: #2d3148;
      color: #e2e8f0;
      border: 1px solid #3d4268;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .arrow { color: #6b7280; font-size: 1.2rem; }

    button {
      padding: 9px 24px;
      border-radius: 8px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    /* ── 실시간 자막 탭 ── */
    .status { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #6b7280; transition: background 0.3s; }
    .dot.connected { background: #34d399; }
    .dot.listening { background: #f59e0b; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    #toggleBtn { background: #7c3aed; color: #fff; margin-left: auto; }
    #toggleBtn:hover { background: #6d28d9; }
    #toggleBtn.stop { background: #dc2626; }
    #toggleBtn.stop:hover { background: #b91c1c; }

    #serverUrl { width: 220px; }

    .subtitle-box {
      background: #1e2130;
      border-radius: 12px;
      padding: 24px;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #6b7280; margin-bottom: 4px; }
    #currentSrc { font-size: 1.1rem; color: #94a3b8; min-height: 28px; }
    #currentTgt { font-size: 1.4rem; font-weight: 600; color: #e2e8f0; min-height: 36px; }

    .history { display: flex; flex-direction: column; gap: 10px; }
    .history-label { font-size: 0.75rem; color: #4b5563; text-transform: uppercase; letter-spacing: 0.08em; padding-bottom: 4px; border-bottom: 1px solid #1e2130; }
    .history-item { background: #1a1d2e; border-radius: 8px; padding: 12px 16px; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .history-item .src { font-size: 0.85rem; color: #6b7280; margin-bottom: 4px; }
    .history-item .tgt { font-size: 1rem; color: #c4b5fd; }
    .error-msg { color: #f87171; font-size: 0.85rem; padding: 8px 12px; background: #3b1212; border-radius: 6px; }

    /* ── 영상 자막 탭 ── */
    .upload-area {
      background: #1e2130;
      border: 2px dashed #3d4268;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .upload-area:hover, .upload-area.dragover { border-color: #7c3aed; }
    .upload-area p { color: #6b7280; font-size: 0.9rem; margin-top: 8px; }
    .upload-area .icon { font-size: 2.5rem; }
    #fileInput { display: none; }
    #fileName { color: #a78bfa; font-size: 0.95rem; margin-top: 8px; font-weight: 600; }

    #uploadBtn { background: #7c3aed; color: #fff; }
    #uploadBtn:hover:not(:disabled) { background: #6d28d9; }
    #uploadBtn:disabled { background: #374151; color: #6b7280; cursor: not-allowed; }

    .progress-box {
      background: #1e2130;
      border-radius: 12px;
      padding: 20px 24px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .progress-box.visible { display: flex; }

    .progress-label { font-size: 0.85rem; color: #94a3b8; }
    .progress-bar-wrap { background: #2d3148; border-radius: 6px; height: 8px; overflow: hidden; }
    .progress-bar { height: 100%; background: #7c3aed; border-radius: 6px; transition: width 0.4s; width: 0%; }

    .status-steps { display: flex; gap: 8px; flex-wrap: wrap; }
    .step {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      background: #2d3148;
      color: #6b7280;
    }
    .step.active { background: #4c1d95; color: #c4b5fd; }
    .step.done { background: #064e3b; color: #34d399; }

    #downloadBtn {
      background: #065f46;
      color: #34d399;
      display: none;
      align-self: flex-start;
    }
    #downloadBtn:hover { background: #047857; }
    #downloadBtn.visible { display: block; }
  </style>
</head>
<body>

<header>
  <h1>TranslateGemma</h1>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('realtime')">실시간 자막</button>
  <button class="tab" onclick="switchTab('video')">영상 자막</button>
</div>

<!-- ══ 실시간 자막 탭 ══ -->
<div id="tab-realtime" class="tab-panel active">

  <div class="controls">
    <input id="serverUrl" type="text" placeholder="WebSocket URL" />
    <select id="srcLang">
      <option value="ko">한국어</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="zh">中文</option>
    </select>
    <span class="arrow">→</span>
    <select id="tgtLang">
      <option value="en">English</option>
      <option value="ko">한국어</option>
      <option value="ja">日本語</option>
      <option value="zh">中文</option>
    </select>
    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="statusText">연결 안됨</span>
    </div>
    <button id="toggleBtn" onclick="toggle()">연결 시작</button>
  </div>

  <div class="subtitle-box">
    <div>
      <div class="label">원문</div>
      <div id="currentSrc">—</div>
    </div>
    <div>
      <div class="label">번역</div>
      <div id="currentTgt">—</div>
    </div>
  </div>

  <div class="history">
    <div class="history-label">이전 자막</div>
    <div id="historyList"></div>
  </div>

</div>

<!-- ══ 영상 자막 탭 ══ -->
<div id="tab-video" class="tab-panel">

  <div class="controls">
    <select id="vSrcLang">
      <option value="ko">한국어</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="zh">中文</option>
    </select>
    <span class="arrow">→</span>
    <select id="vTgtLang">
      <option value="en">English</option>
      <option value="ko">한국어</option>
      <option value="ja">日本語</option>
      <option value="zh">中文</option>
    </select>
    <button id="uploadBtn" onclick="uploadVideo()" disabled style="margin-left:auto">자막 생성</button>
  </div>

  <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()"
       ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
    <div class="icon">🎬</div>
    <div id="fileName">클릭하거나 파일을 드래그하세요</div>
    <p>MP4, MKV, AVI, MOV, WebM 지원</p>
    <input type="file" id="fileInput" accept=".mp4,.mkv,.avi,.mov,.webm,.m4v,.flv" onchange="onFileSelect(event)" />
  </div>

  <div class="progress-box" id="progressBox">
    <div class="progress-label" id="progressLabel">처리 중...</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status-steps">
      <span class="step" id="step-extracting">오디오 추출</span>
      <span class="step" id="step-transcribing">STT</span>
      <span class="step" id="step-translating">번역</span>
      <span class="step" id="step-done">완료</span>
    </div>
    <button id="downloadBtn" onclick="downloadSrt()">SRT 다운로드</button>
  </div>

</div>

<script>
  /* ── 탭 전환 ── */
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach((t, i) => {
      const panels = ['realtime', 'video'];
      t.classList.toggle('active', panels[i] === name);
    });
    document.querySelectorAll('.tab-panel').forEach(p => {
      p.classList.toggle('active', p.id === 'tab-' + name);
    });
  }

  /* ══════════════════════════════════════════
     실시간 자막
  ══════════════════════════════════════════ */
  // 현재 접속 주소 기반으로 WebSocket URL 자동 설정
  const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  document.getElementById('serverUrl').value = `${wsProto}//${location.host}/ws/subtitle`;

  const SAMPLE_RATE   = 16000;
  const VAD_THRESHOLD = 0.01;
  const SILENCE_LIMIT = 8;
  const CHUNK_SIZE    = 4096;
  const SEND_INTERVAL = 5000;

  let ws, audioCtx, processor, stream, running = false, sending = false;
  let speaking = false, silenceCount = 0, audioChunks = [], lastSendTime = 0;

  function toggle() { running ? stop() : start(); }

  async function start() {
    const url     = document.getElementById('serverUrl').value;
    const srcLang = document.getElementById('srcLang').value;
    const tgtLang = document.getElementById('tgtLang').value;
    setStatus('connecting', '연결 중...');

    ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';

    ws.onopen = async () => {
      ws.send(JSON.stringify({ src_lang: srcLang, tgt_lang: tgtLang }));
      setStatus('connected', '연결됨');
      await startMic();
      running = true;
      document.getElementById('toggleBtn').textContent = '중지';
      document.getElementById('toggleBtn').classList.add('stop');
    };

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'stt') {
        document.getElementById('currentSrc').textContent = data.text;
      } else if (data.type === 'translation') {
        const prevSrc = document.getElementById('currentSrc').textContent;
        const prevTgt = document.getElementById('currentTgt').textContent;
        if (prevTgt && prevTgt !== '—') addHistory(prevSrc, prevTgt);
        document.getElementById('currentTgt').textContent = data.text;
      } else if (data.type === 'error') {
        showError(data.text);
      }
    };

    ws.onclose = () => { setStatus('disconnected', '연결 끊김'); stop(); };
    ws.onerror = () => { setStatus('disconnected', '연결 오류'); stop(); };
  }

  function stop() {
    running = false;
    if (processor) { processor.disconnect(); processor = null; }
    if (stream)    { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (audioCtx)  { audioCtx.close(); audioCtx = null; }
    if (ws && ws.readyState === WebSocket.OPEN) ws.close();
    ws = null;
    speaking = false; silenceCount = 0; audioChunks = [];
    setStatus('disconnected', '연결 안됨');
    document.getElementById('toggleBtn').textContent = '연결 시작';
    document.getElementById('toggleBtn').classList.remove('stop');
  }

  async function startMic() {
    stream   = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    audioCtx = new AudioContext();
    const source = audioCtx.createMediaStreamSource(stream);
    processor    = audioCtx.createScriptProcessor(CHUNK_SIZE, 1, 1);

    processor.onaudioprocess = async (e) => {
      const input = e.inputBuffer.getChannelData(0);
      const rms   = Math.sqrt(input.reduce((s, x) => s + x * x, 0) / input.length);

      if (rms > VAD_THRESHOLD) {
        if (!speaking) { speaking = true; lastSendTime = Date.now(); setStatus('listening', '음성 감지 중...'); }
        silenceCount = 0;
        audioChunks.push(new Float32Array(input));
        if (!sending && Date.now() - lastSendTime >= SEND_INTERVAL) {
          lastSendTime = Date.now();
          await sendAudio();
        }
      } else if (speaking) {
        audioChunks.push(new Float32Array(input));
        silenceCount++;
        if (silenceCount >= SILENCE_LIMIT) {
          speaking = false; silenceCount = 0;
          setStatus('connected', '연결됨');
          await sendAudio();
        }
      }
    };

    source.connect(processor);
    processor.connect(audioCtx.destination);
  }

  async function sendAudio() {
    if (audioChunks.length === 0 || sending) return;
    sending = true;
    const chunks = audioChunks; audioChunks = [];
    const total = chunks.reduce((s, c) => s + c.length, 0);
    const combined = new Float32Array(total);
    let offset = 0;
    for (const c of chunks) { combined.set(c, offset); offset += c.length; }
    const resampled = await resampleTo16k(combined, audioCtx.sampleRate);
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(resampled.buffer);
    sending = false;
  }

  async function resampleTo16k(samples, fromRate) {
    if (fromRate === SAMPLE_RATE) return samples;
    const buf = audioCtx.createBuffer(1, samples.length, fromRate);
    buf.getChannelData(0).set(samples);
    const targetLen  = Math.round(samples.length * SAMPLE_RATE / fromRate);
    const offlineCtx = new OfflineAudioContext(1, targetLen, SAMPLE_RATE);
    const src        = offlineCtx.createBufferSource();
    src.buffer = buf; src.connect(offlineCtx.destination); src.start();
    const rendered = await offlineCtx.startRendering();
    return rendered.getChannelData(0);
  }

  function setStatus(state, text) {
    const dot = document.getElementById('dot');
    dot.className = 'dot';
    if (state === 'connected')  dot.classList.add('connected');
    if (state === 'listening')  dot.classList.add('listening');
    document.getElementById('statusText').textContent = text;
  }

  function addHistory(src, tgt) {
    const list = document.getElementById('historyList');
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `<div class="src">${escHtml(src)}</div><div class="tgt">${escHtml(tgt)}</div>`;
    list.prepend(item);
    while (list.children.length > 20) list.removeChild(list.lastChild);
  }

  function showError(msg) {
    const list = document.getElementById('historyList');
    const item = document.createElement('div');
    item.className = 'error-msg';
    item.textContent = '오류: ' + msg;
    list.prepend(item);
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* ══════════════════════════════════════════
     영상 자막
  ══════════════════════════════════════════ */
  let selectedFile = null;
  let currentJobId = null;
  let pollTimer    = null;

  const STEP_ORDER  = ['extracting', 'transcribing', 'translating', 'done'];
  const STEP_LABELS = { extracting: '오디오 추출', transcribing: 'STT', translating: '번역', done: '완료' };
  const STEP_PCT    = { extracting: 20, transcribing: 50, translating: 80, done: 100 };

  function onFileSelect(e) {
    const file = e.target.files[0];
    if (file) setFile(file);
  }

  function onDragOver(e) {
    e.preventDefault();
    document.getElementById('uploadArea').classList.add('dragover');
  }

  function onDragLeave(e) {
    document.getElementById('uploadArea').classList.remove('dragover');
  }

  function onDrop(e) {
    e.preventDefault();
    document.getElementById('uploadArea').classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) setFile(file);
  }

  function setFile(file) {
    selectedFile = file;
    document.getElementById('fileName').textContent = file.name;
    document.getElementById('uploadBtn').disabled = false;
  }

  async function uploadVideo() {
    if (!selectedFile) return;

    document.getElementById('uploadBtn').disabled = true;
    document.getElementById('downloadBtn').classList.remove('visible');

    const formData = new FormData();
    formData.append('file', selectedFile);
    formData.append('src_lang', document.getElementById('vSrcLang').value);
    formData.append('tgt_lang', document.getElementById('vTgtLang').value);

    showProgress('queued');

    try {
      const res  = await fetch('/subtitle/upload', { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || '업로드 실패');
      currentJobId = data.job_id;
      pollTimer = setInterval(pollStatus, 2000);
    } catch (err) {
      showProgressError(err.message);
    }
  }

  async function pollStatus() {
    try {
      const res  = await fetch(`/subtitle/jobs/${currentJobId}`);
      const data = await res.json();
      showProgress(data.status);

      if (data.status === 'done') {
        clearInterval(pollTimer);
        document.getElementById('downloadBtn').classList.add('visible');
        document.getElementById('uploadBtn').disabled = false;
      } else if (data.status === 'error') {
        clearInterval(pollTimer);
        showProgressError(data.error || '처리 중 오류 발생');
        document.getElementById('uploadBtn').disabled = false;
      }
    } catch (err) {
      clearInterval(pollTimer);
      showProgressError('상태 확인 실패');
    }
  }

  function showProgress(status) {
    const box = document.getElementById('progressBox');
    box.classList.add('visible');

    STEP_ORDER.forEach(s => {
      const el = document.getElementById('step-' + s);
      el.className = 'step';
      const idx     = STEP_ORDER.indexOf(s);
      const current = STEP_ORDER.indexOf(status);
      if (idx < current)       el.classList.add('done');
      else if (idx === current) el.classList.add('active');
    });

    const pct = STEP_PCT[status] ?? 5;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressLabel').textContent =
      status === 'done' ? '처리 완료!' :
      status === 'queued' ? '업로드 완료, 처리 대기 중...' :
      (STEP_LABELS[status] ?? status) + ' 중...';
  }

  function showProgressError(msg) {
    document.getElementById('progressBox').classList.add('visible');
    document.getElementById('progressLabel').textContent = '오류: ' + msg;
    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('progressBar').style.background = '#dc2626';
  }

  function downloadSrt() {
    if (currentJobId) window.location.href = `/subtitle/download/${currentJobId}`;
  }
</script>
</body>
</html>
