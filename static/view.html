<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 자막</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
      padding-top: 48px;
    }

    .status-bar {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #6b7280;
      z-index: 10;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #374151;
    }
    .dot.connected { background: #34d399; }
    .dot.waiting   { background: #f59e0b; animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .subtitle-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .subtitle-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      animation: appear 0.3s ease;
    }

    .subtitle-item.current .translated {
      color: #fff;
    }

    .subtitle-item:not(.current) .translated {
      color: #6b7280;
    }

    .subtitle-item:not(.current) .original {
      display: none;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .original {
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      color: #4b5563;
      text-shadow: 0 1px 4px #000;
    }

    .translated {
      font-size: clamp(1.3rem, 4.5vw, 2.4rem);
      font-weight: 700;
      text-shadow: 0 2px 8px #000;
      line-height: 1.3;
    }

    /* STT 진행 중 표시 */
    .stt-preview {
      font-size: clamp(0.9rem, 2.5vw, 1.2rem);
      color: #374151;
      font-style: italic;
      max-width: 900px;
      width: 100%;
      margin: 8px auto 0;
    }
  </style>
</head>
<body>

<div class="status-bar">
  <div class="dot waiting" id="dot"></div>
  <span id="statusText">연결 중...</span>
</div>

<div class="subtitle-list" id="subtitleList"></div>
<div class="stt-preview" id="sttPreview"></div>

<script>
  const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl   = `${wsProto}//${location.host}/ws/viewer`;

  let currentItem = null;
  let pendingSrc  = '';
  let streaming   = false;

  function addSubtitle(src, tgt) {
    const list = document.getElementById('subtitleList');

    // 이전 항목 흐리게
    if (currentItem) {
      currentItem.classList.remove('current');
    }

    const item = document.createElement('div');
    item.className = 'subtitle-item current';
    item.innerHTML = `
      <div class="original">${escHtml(src)}</div>
      <div class="translated">${escHtml(tgt)}</div>
    `;
    list.appendChild(item);
    currentItem = item;

    // 맨 아래로 스크롤
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  function updateCurrent(tgt) {
    if (!currentItem) { addSubtitle(pendingSrc, tgt); return; }
    currentItem.querySelector('.translated').textContent = tgt;
    window.scrollTo(0, document.body.scrollHeight);
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function connect() {
    const ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      document.getElementById('dot').className = 'dot connected';
      document.getElementById('statusText').textContent = '연결됨';
    };

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'stt') {
        pendingSrc = data.text;
        document.getElementById('sttPreview').textContent = data.text;
      } else if (data.type === 'translation') {
        if (!streaming) {
          // 새 번역 시작 — 새 자막 항목 생성
          document.getElementById('sttPreview').textContent = '';
          addSubtitle(pendingSrc, data.text);
          streaming = true;
        } else {
          updateCurrent(data.text);   // 부분 번역 — 현재 항목 갱신
        }
        if (data.done) {
          streaming = false;
          pendingSrc = '';
        }
      }
    };

    ws.onclose = () => {
      document.getElementById('dot').className = 'dot waiting';
      document.getElementById('statusText').textContent = '재연결 중...';
      setTimeout(connect, 2000);
    };

    ws.onerror = () => ws.close();
  }

  connect();
</script>
</body>
</html>
